services:
  app:
    build: .
    ports:
      - "${PORT:-4444}:4444"
    environment:
      PORT: "4444"
      MONGO_CONNECTION_STRING: mongodb://mongo:27017/pittplanner
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env; see README.md}
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mongo-data:
